[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notify"
version = "0.1.0"
description = "Notify: сервис уведомлений (учебный проект)"
requires-python = ">=3.12"
# Доменное ядро не имеет внешних зависимостей. FastAPI, SQLAlchemy, httpx
# добавятся отдельными группами на практиках 4 и 6, не в ядро.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

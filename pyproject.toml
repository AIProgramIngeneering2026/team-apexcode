[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notify"
version = "0.1.0"
description = "Notify: сервис уведомлений (учебный проект)"
requires-python = ">=3.12"
# Доменное ядро не имеет внешних зависимостей. FastAPI, SQLAlchemy, httpx живут в отдельных
# группах (`api`, `storage`; httpx-адаптер добавится на практике 6), не в ядре.
dependencies = []

[project.optional-dependencies]
storage = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",      # TestClient FastAPI
    "pyyaml>=6.0",      # чтение docs/api/openapi.yaml в тесте контракта
    "jsonschema>=4.22", # проверка ответов по схемам из контракта
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
